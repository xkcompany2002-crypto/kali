name: Unpack XK StockStream v4 source
on:
  push:
    branches:
      - build-xk-trade-ai-desktop
    paths:
      - ".stockstream-upload/part006e.b64"
permissions:
  contents: write
jobs:
  unpack-source:
    if: github.ref_name == 'build-xk-trade-ai-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract and commit StockStream source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .stockstream-upload/part001.b64 \
            .stockstream-upload/part002.b64 \
            .stockstream-upload/part003.b64 \
            .stockstream-upload/part004a.b64 \
            .stockstream-upload/part004b1.b64 \
            .stockstream-upload/part004b2.b64 \
            .stockstream-upload/part004b3a.b64 \
            .stockstream-upload/part004b3b.b64 \
            .stockstream-upload/part004c.b64 \
            .stockstream-upload/part004d.b64 \
            .stockstream-upload/part005a.b64 \
            .stockstream-upload/part005b.b64 \
            .stockstream-upload/part005c.b64 \
            .stockstream-upload/part005d.b64 \
            .stockstream-upload/part005e.b64 \
            .stockstream-upload/part006a.b64 \
            .stockstream-upload/part006b.b64 \
            .stockstream-upload/part006c.b64 \
            .stockstream-upload/part006d.b64 \
            .stockstream-upload/part006e.b64; do
            test -s "$file"
          done
          cat \
            .stockstream-upload/part001.b64 \
            .stockstream-upload/part002.b64 \
            .stockstream-upload/part003.b64 \
            .stockstream-upload/part004a.b64 \
            .stockstream-upload/part004b1.b64 \
            .stockstream-upload/part004b2.b64 \
            .stockstream-upload/part004b3a.b64 \
            .stockstream-upload/part004b3b.b64 \
            .stockstream-upload/part004c.b64 \
            .stockstream-upload/part004d.b64 \
            .stockstream-upload/part005a.b64 \
            .stockstream-upload/part005b.b64 \
            .stockstream-upload/part005c.b64 \
            .stockstream-upload/part005d.b64 \
            .stockstream-upload/part005e.b64 \
            .stockstream-upload/part006a.b64 \
            .stockstream-upload/part006b.b64 \
            .stockstream-upload/part006c.b64 \
            .stockstream-upload/part006d.b64 \
            .stockstream-upload/part006e.b64 | base64 --decode > /tmp/xk-stockstream-v4.zip
          echo '750bf4321eab4cac051e34b172c266d893df19010d1c5cc92ab168f1669802e1  /tmp/xk-stockstream-v4.zip' | sha256sum --check
          mkdir -p /tmp/xk-stockstream-unpack stockstream-v4
          unzip -q /tmp/xk-stockstream-v4.zip -d /tmp/xk-stockstream-unpack
          test -f /tmp/xk-stockstream-unpack/xk-stockstream-qwen-ready/package.json
          cp -a /tmp/xk-stockstream-unpack/xk-stockstream-qwen-ready/. stockstream-v4/
          rm -f .stockstream-upload/part*.b64
          rmdir .stockstream-upload 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add XK StockStream v4 deployment-ready source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
