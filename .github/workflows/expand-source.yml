name: Expand XK-TRADE-BOT source package
on:
  push:
    branches: [main]
    paths: ['project-package/READY']
permissions:
  contents: write
jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f project-package/READY
          test "$(find project-package -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 10
          cat project-package/part-*.b64 | tr -d '\r\n ' | base64 -d > /tmp/xk-source.tar.xz
          tar -tJf /tmp/xk-source.tar.xz >/dev/null
          mkdir -p /tmp/xk-package
          tar -xJf /tmp/xk-source.tar.xz -C /tmp/xk-package
          test -d /tmp/xk-package/xk_trade_next
          cp -a /tmp/xk-package/xk_trade_next/. .
          rm -rf project-package /tmp/xk-package /tmp/xk-source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add XK-TRADE-BOT production source"
          git push
