<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Live browser view</title>
    <style>
      :root { color-scheme: dark; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; background: #071213; color: #dce9e5; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: radial-gradient(ellipse at 50% 0, rgba(45,212,168,.07), transparent 65%), #071213; }
      .viewer { position: relative; display: grid; width: 100%; height: 100%; place-items: center; overflow: hidden; }
      #page-shot { width: 100%; height: 100%; object-fit: contain; background: #fff; }
      .control-layer { position: absolute; z-index: 2; inset: 0; pointer-events: none; }
      .control-layer.is-enabled { cursor: crosshair; pointer-events: auto; touch-action: none; }
      .manual-cursor { position: absolute; top: 0; left: 0; display: none; width: 25px; height: 32px; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.72)); transform: translate(-2px,-2px); }
      .control-layer.is-enabled.has-pointer .manual-cursor { display: block; }
      .manual-cursor svg { display: block; width: 100%; height: 100%; }
      .manual-cursor.is-clicking { transform: translate(-2px,-2px) scale(.82); }
      .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 25px; text-align: center; }
      .placeholder-mark { display: grid; width: 46px; height: 46px; place-items: center; margin-bottom: 6px; border: 1px solid rgba(45,212,168,.22); border-radius: 15px; color: #2dd4a8; background: rgba(45,212,168,.07); font-size: 21px; }
      .placeholder strong { font-size: 13px; font-weight: 600; }
      .placeholder small { max-width: 250px; color: #738b84; font-size: 10px; line-height: 1.6; }
      .viewer-state { position: absolute; z-index: 3; right: 12px; bottom: 10px; max-width: calc(100% - 24px); padding: 5px 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; color: #dce9e5; background: rgba(6,17,18,.72); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; backdrop-filter: blur(8px); }
      .viewer-state[hidden], #page-shot[hidden], .placeholder[hidden] { display: none; }
    </style>
    <script src="/browser-view.js" defer></script>
  </head>
  <body>
    <main class="viewer">
      <div class="placeholder" id="viewer-empty"><span class="placeholder-mark" aria-hidden="true">↗</span><strong>Your live research view</strong><small>Search or enter a public URL. The isolated browser will appear here as it works.</small></div>
      <img id="page-shot" alt="Current public webpage shown in an isolated browser" hidden />
      <div class="control-layer" id="control-layer" aria-label="Safe manual browser control">
        <span class="manual-cursor" id="manual-cursor" aria-hidden="true"><svg viewBox="0 0 24 32" fill="none"><path d="M3 2.5 20.5 18l-8.1.7-3.8 7.1L3 2.5Z" fill="#2dd4a8" stroke="#06211b" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="viewer-state" id="viewer-state" hidden></div>
    </main>
  </body>
</html>
