<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة البث المباشر للأسهم العالمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg-base: #080b11;
        --bg-panel: rgba(20, 26, 38, 0.6);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --neon-green: #00e676;
        --neon-red: #ff1744;
        --neon-blue: #2979ff;
        --glass-blur: blur(16px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    
    body{
        font-family: 'Cairo', sans-serif;
        background-color: var(--bg-base);
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(41, 121, 255, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 85% 30%, rgba(0, 230, 118, 0.05) 0%, transparent 50%);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* شريط التمرير */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    header{
        padding: 20px 32px;
        background: rgba(8, 11, 17, 0.8);
        backdrop-filter: var(--glass-blur);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.4rem;
        font-weight: 700;
        background: linear-gradient(90deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .logo-icon {
        font-size: 1.8rem;
        filter: drop-shadow(0 0 8px rgba(41, 121, 255, 0.6));
    }

    #status{
        font-size: 0.85rem;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    #status::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #94a3b8;
        display: inline-block;
    }

    #status.live{ color: var(--neon-green); border-color: rgba(0, 230, 118, 0.3); background: rgba(0, 230, 118, 0.05); }
    #status.live::before { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); animation: pulse 2s infinite; }
    
    #status.polling{ color: #f59e0b; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05); }
    #status.polling::before { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }

    @keyframes pulse {
        0% { transform: scale(0.95); opacity: 1; }
        50% { transform: scale(1.2); opacity: 0.7; }
        100% { transform: scale(0.95); opacity: 1; }
    }

    .tv-tape-wrap{
        border-bottom: 1px solid var(--border-color);
        background: #000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    main { padding: 32px; max-width: 1700px; margin: 0 auto; }

    /* التبويبات الاحترافية */
    .tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        background: var(--bg-panel);
        backdrop-filter: var(--glass-blur);
        padding: 8px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        width: fit-content;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .tab-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 12px 24px;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .tab-btn.active {
        background: linear-gradient(135deg, var(--neon-blue), #1e40af);
        color: #fff;
        box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4);
    }

    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* شريط البحث */
    .toolbar{
        display:flex;
        gap:12px;
        margin-bottom:24px;
        flex-wrap:wrap;
        background: var(--bg-panel);
        padding: 16px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        backdrop-filter: var(--glass-blur);
    }

    .toolbar input{
        flex:1;
        min-width:250px;
        padding:14px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: rgba(0,0,0,0.2);
        color: var(--text-main);
        font-family: inherit;
        font-size: 1rem;
        outline:none;
        transition: all 0.3s ease;
    }

    .toolbar input:focus{
        border-color: var(--neon-blue);
        box-shadow: 0 0 0 3px rgba(41, 121, 255, 0.2);
    }

    .toolbar button{
        padding: 14px 28px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, var(--neon-blue), #1e40af);
        color: #fff;
        font-weight: 700;
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(41, 121, 255, 0.3);
    }

    .toolbar button:hover{
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(41, 121, 255, 0.5);
    }

    /* بطاقات الأسهم */
    .grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
        gap:20px;
    }

    .card{
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
        backdrop-filter: var(--glass-blur);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 20px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 3px;
        background: transparent;
        transition: background 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        border-color: rgba(255,255,255,0.15);
    }

    .card.flash-up::before { background: var(--neon-green); }
    .card.flash-down::before { background: var(--neon-red); }

    .card .symbol{
        font-size: 1.1rem;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .card .symbol .src{
        font-size: 0.65rem;
        color: var(--text-muted);
        background: rgba(0,0,0,0.4);
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
    }

    .card .price{
        font-size: 1.8rem;
        font-weight: 700;
        margin: 8px 0;
        font-variant-numeric: tabular-nums;
        transition: color 0.3s ease;
        letter-spacing: -0.5px;
    }

    .card .price.up { color: var(--neon-green); text-shadow: 0 0 15px rgba(0, 230, 118, 0.3); }
    .card .price.down { color: var(--neon-red); text-shadow: 0 0 15px rgba(255, 23, 68, 0.3); }

    .card .change{
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .card .change.up { color: var(--neon-green); }
    .card .change.down { color: var(--neon-red); }

    .card .remove-btn{
        position: absolute;
        bottom: 16px;
        left: 16px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1rem;
        padding: 4px;
        transition: all 0.2s;
        opacity: 0;
    }

    .card:hover .remove-btn { opacity: 1; }
    .card .remove-btn:hover { color: var(--neon-red); transform: scale(1.2); }

    /* حاوية TradingView */
    .tv-container{
        height: 700px;
        width: 100%;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        background: #131722;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    @media (max-width: 768px) {
        main { padding: 16px; }
        header { padding: 16px; }
        .tabs { flex-direction: column; width: 100%; }
        .toolbar { flex-direction: column; }
    }
</style>
</head>
<body>

<header>
    <div class="logo-area">
        <span class="logo-icon">🌐</span>
        <span>StockStream Global</span>
    </div>
    <div id="status">جارٍ الاتصال...</div>
</header>

<div class="tv-tape-wrap"><div id="tradingview-tape"></div></div>

<main>
    <!-- التبويبات -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('heatmap')">🗺️ خريطة السوق (Heatmap)</button>
        <button class="tab-btn" onclick="switchTab('screener')">🔍 شاشة الفلترة (20,000+ سهم)</button>
        <button class="tab-btn" onclick="switchTab('live')">⚡ البث المباشر (أعلى 50 سهم)</button>
    </div>

    <!-- 1. الخريطة الحرارية -->
    <div id="tab-heatmap" class="tab-content active">
        <div class="tv-container" id="tv-heatmap"></div>
    </div>

    <!-- 2. شاشة الفلترة -->
    <div id="tab-screener" class="tab-content">
        <div class="tv-container" id="tv-screener"></div>
    </div>

    <!-- 3. البث اللحظي -->
    <div id="tab-live" class="tab-content">
        <div class="toolbar">
            <input type="text" id="symbolInput" placeholder="ابحث عن رمز سهم لإضافته للبث (مثال: AAPL, TSLA, NVDA)" />
            <button id="addBtn">+ إضافة للبث</button>
            <button id="clearBtn" style="background:#1e293b; box-shadow:none;">مسح الكل</button>
        </div>
        <div class="grid" id="cardsGrid"></div>
    </div>
</main>

<script>
// ================= الإعدادات =================
const WS_URL = `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`;
const REST_URL = "/api/v1";

const DEFAULT_SYMBOLS = ["AAPL","MSFT","GOOGL","AMZN","NVDA","META","TSLA","JPM","V","JNJ","WMT","XOM","NFLX","AMD","INTC","SAP","TM","BABA","TSM","ASML"];

const symbols = new Set();
const latestPrices = new Map();
const priceElements = new Map();
let socket = null;
let pollTimer = null;
let usingPolling = false;
let pollOffset = 0;

function setStatus(text, cls=""){ 
    const el = document.getElementById("status"); 
    el.textContent = text; 
    el.className = cls; 
}

// ================= التبويبات =================
function switchTab(tabId, evt) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    // التعامل مع زر التبويب بشكل آمن
    const btn = evt ? evt.currentTarget : document.querySelector(`.tab-btn[onclick*="${tabId}"]`);
    if(btn) btn.classList.add('active');
}

// ================= TradingView Widgets =================
// 1. الشريط العلوي
(function(){
    const c = document.getElementById("tradingview-tape");
    const w = document.createElement("div"); w.className="tradingview-widget-container";
    const i = document.createElement("div"); i.className="tradingview-widget-container__widget";
    w.appendChild(i); c.appendChild(w);
    const s = document.createElement("script");
    s.src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
    s.async=true;
    s.innerHTML=JSON.stringify({
        symbols:[
            {proName:"FOREXCOM:SPXUSD",title:"S&P 500"},
            {proName:"FOREXCOM:NSXUSD",title:"US 100"},
            {proName:"FOREXCOM:DJI",title:"Dow 30"},
            {proName:"INDEX:NKY",title:"Nikkei 225"},
            {proName:"INDEX:DEU40",title:"DAX"},
            {proName:"FOREXCOM:UKXGBP",title:"FTSE 100"},
            {proName:"BITSTAMP:BTCUSD",title:"Bitcoin"}
        ],
        showSymbolLogo:true, colorTheme:"dark", displayMode:"adaptive", locale:"ar"
    });
    w.appendChild(s);
})();

// 2. الخريطة الحرارية
(function(){
    const s = document.createElement("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
    s.async = true;
    s.innerHTML = JSON.stringify({
        exchanges: [],
        dataSource: "SPX500",
        grouping: "sector",
        blockSize: "market_cap_basic",
        blockColor: "change",
        locale: "ar",
        symbolUrl: "",
        colorTheme: "dark",
        hasTopBar: true,
        isDataSetEnabled: true,
        isZoomEnabled: true,
        hasSymbolTooltip: true,
        width: "100%",
        height: "100%"
    });
    document.getElementById("tv-heatmap").appendChild(s);
})();

// 3. شاشة الفلترة
(function(){
    const s = document.createElement("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-screener.js";
    s.async = true;
    s.innerHTML = JSON.stringify({
        width: "100%",
        height: "100%",
        defaultColumn: "overview",
        defaultScreen: "general",
        market: "global",
        showToolbar: true,
        colorTheme: "dark",
        locale: "ar"
    });
    document.getElementById("tv-screener").appendChild(s);
})();

// ================= البث المباشر (WebSocket) =================
function connectSocket(){
    if (socket && (socket.readyState===0 || socket.readyState===1)) return;
    setStatus("جارٍ الاتصال بالبث...");
    try { socket = new WebSocket(WS_URL); } catch(e){ startPollingFallback(); return; }

    socket.addEventListener("open", () => {
        usingPolling = false;
        stopPolling();
        setStatus("متصل — بث لحظي", "live");
        symbols.forEach(sym => socket.send(JSON.stringify({type:"subscribe", symbol:sym})));
    });

    socket.addEventListener("message", (evt) => {
        let d; try { d=JSON.parse(evt.data); } catch { return; }
        if (d.type === "ping") return;
        if (d.type !== "trade" || !Array.isArray(d.data)) return;
        d.data.forEach(t => { if (t.s && typeof t.p === "number") updateCard(t.s, t.p); });
    });

    socket.addEventListener("close", () => {
        if (!usingPolling) { 
            setStatus("وضع التحديث الدوري", "polling"); 
            startPollingFallback(); 
        }
    });
}

function startPollingFallback(){
    if (usingPolling) return;
    usingPolling = true;
    setStatus("وضع التحديث الدوري (15 ثانية)", "polling");
    pollOnce();
    pollTimer = setInterval(pollOnce, 15000);
}

function stopPolling(){ 
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } 
    usingPolling = false; 
}

async function pollOnce(){
    const all = [...symbols];
    if (!all.length) return;
    const count = Math.min(5, all.length);
    const batch = Array.from({length: count}, (_, i) => all[(pollOffset + i) % all.length]);
    pollOffset = (pollOffset + count) % all.length;
    for (const sym of batch) {
        try {
            const res = await fetch(`${REST_URL}/quote?symbol=${encodeURIComponent(sym)}`);
            if (!res.ok) { if (res.status === 429) break; continue; }
            const q = await res.json();
            if (q && typeof q.c === "number" && q.c > 0) updateCard(sym, q.c, q.pc);
            await new Promise(r => setTimeout(r, 120));
        } catch(e) {}
    }
}

// ================= إنشاء وتحديث البطاقات =================
function createCard(sym){
    if (priceElements.has(sym)) return;
    const grid = document.getElementById("cardsGrid");
    const card = document.createElement("div");
    card.className = "card"; 
    card.dataset.symbol = sym;
    
    card.innerHTML = `
        <button class="remove-btn" title="إزالة">✕</button>
        <div class="symbol">
            <span>${sym}</span>
            <span class="src">LIVE</span>
        </div>
        <div class="price">—</div>
        <div class="change"></div>
    `;
    
    const priceSpan = card.querySelector(".price");
    const changeSpan = card.querySelector(".change");
    const srcSpan = card.querySelector(".src");
    
    card.querySelector(".remove-btn").addEventListener("click", () => removeSymbol(sym));
    grid.appendChild(card);
    priceElements.set(sym, {card, priceSpan, changeSpan, srcSpan, prevClose: null});
    symbols.add(sym);
}

function formatPrice(p){ return p>=1?p.toFixed(2):p.toFixed(4); }

function updateCard(sym, price, prevClose){
    const refs = priceElements.get(sym); 
    if (!refs) return;
    
    if (typeof prevClose === "number" && prevClose > 0) refs.prevClose = prevClose;
    
    const prev = latestPrices.get(sym);
    latestPrices.set(sym, price);
    
    refs.priceSpan.textContent = formatPrice(price);
    refs.srcSpan.textContent = usingPolling ? "REST" : "LIVE";

    // حساب النسبة المئوية
    if (refs.prevClose && refs.prevClose > 0){
        const diff = price - refs.prevClose;
        const pct = (diff/refs.prevClose)*100;
        
        // تحديث النص والاتجاه
        refs.changeSpan.textContent = `${diff>=0?"▲":"▼"} ${Math.abs(pct).toFixed(2)}%`;
        refs.changeSpan.className = "change " + (diff>=0?"up":"down");
        refs.priceSpan.className = "price " + (diff>=0?"up":"down");
    }

    // تأثير النبضة عند تغير السعر
    if (typeof prev==="number" && price!==prev){
        refs.card.classList.remove("flash-up","flash-down");
        void refs.card.offsetWidth; // Trigger Reflow
        refs.card.classList.add(price>prev?"flash-up":"flash-down");
        setTimeout(()=>refs.card.classList.remove("flash-up","flash-down"), 800);
    }
}

// ================= إدارة الرموز =================
function subscribeSymbol(sym){ if (socket && socket.readyState === 1) socket.send(JSON.stringify({type:"subscribe", symbol:sym})); }
function unsubscribeSymbol(sym){ if (socket && socket.readyState === 1) socket.send(JSON.stringify({type:"unsubscribe", symbol:sym})); }

function addSymbolFromInput(){
    const inp = document.getElementById("symbolInput");
    const raw = inp.value.trim().toUpperCase();
    if (!raw) return;
    
    raw.split(/[,،\s]+/).forEach(sym => {
        const clean = sym.replace(/[^A-Z0-9.\-]/g,"");
        if (!clean || symbols.has(clean)) return;
        createCard(clean);
        subscribeSymbol(clean);
        fetch(`${REST_URL}/quote?symbol=${encodeURIComponent(clean)}`)
            .then(r=>r.json()).then(q=>{ if(q&&q.c>0) updateCard(clean, q.c, q.pc); }).catch(()=>{});
    });
    inp.value="";
}

function removeSymbol(sym){
    if (!symbols.has(sym)) return;
    symbols.delete(sym); 
    unsubscribeSymbol(sym);
    const r = priceElements.get(sym);
    if (r) { r.card.remove(); priceElements.delete(sym); }
    latestPrices.delete(sym);
}

// ================= التشغيل =================
document.getElementById("addBtn").addEventListener("click", addSymbolFromInput);
document.getElementById("symbolInput").addEventListener("keydown", e => { if (e.key==="Enter") addSymbolFromInput(); });
document.getElementById("clearBtn").addEventListener("click", () => [...symbols].forEach(removeSymbol));

window.addEventListener("load", () => {
    DEFAULT_SYMBOLS.forEach(createCard);

    // Pace initial quote requests to reduce provider rate-limit bursts.
    (async () => {
        for (const sym of DEFAULT_SYMBOLS) {
            try {
                const response = await fetch(`${REST_URL}/quote?symbol=${encodeURIComponent(sym)}`);
                if (response.ok) {
                    const quote = await response.json();
                    if (quote && quote.c > 0) updateCard(sym, quote.c, quote.pc);
                }
            } catch (error) {}
            await new Promise(resolve => setTimeout(resolve, 900));
        }
    })();

    connectSocket();

    setTimeout(() => {
        if (!socket || socket.readyState !== 1) startPollingFallback();
    }, 5000);
});
</script>
</body>
</html>
