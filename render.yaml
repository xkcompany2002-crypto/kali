services:
  - type: web
    name: xk-trade-bot
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TOKEN_HARBOR_API_KEY
        sync: false
      - key: TOKEN_HARBOR_MODEL
        value: deepseek-v4.1-flash:free
      - key: TOKEN_HARBOR_URL
        value: https://tokenharbor.ai/v1/chat/completions
